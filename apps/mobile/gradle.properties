# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (required by every androidx.* artifact)
android.useAndroidX=true
android.nonTransitiveRClass=true
# The sandbox SDK at /opt/android-sdk is read-only and missing platform-tools;
# AGP's in-daemon auto-installer crashes the daemon here. Everything the build
# needs (platform-36, build-tools 36.0.0) is pre-installed — never auto-download.
android.builder.sdkDownload=false

# Official Kotlin code style — ktlint (standard ruleset) enforces the same style.
kotlin.code.style=official
